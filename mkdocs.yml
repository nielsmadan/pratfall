site_name: Pratfall
site_description: One-shot invocations of installed coding agents with named profiles.
repo_url: https://github.com/nielsmadan/pratfall
repo_name: nielsmadan/pratfall

docs_dir: docs/user

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Profiles and configuration: profiles.md
  - Running prompts: running.md
  - JSON output: json.md
  - Agents and limitations: agents.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
