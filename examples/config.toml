version = 1

[defaults]
timeout = 600

[agents.codex]
command = ["codex"]

[agents.claude]
command = ["/absolute/path/to/trusted-claude-wrapper", "--team"]

[profiles.simple]
agent = "codex"
model = "gpt-5.6-luna"
effort = "low"

[profiles.review]
agent = "cc"
model = "claude-sonnet-4"
max_turns = 4
native_args = ["--permission-mode", "plan"]

[profiles.remove-empty]
agent = "cc"
prompt = "Delete empty files under $folder."

[profiles.review-fast]
extends = "review"
fast = true

[profiles.summarize]
agent = "cc"
prompt = "Summarize the following in five bullet points."

[profiles.risks]
agent = "codex"
prompt = "List the risks in the following."

[profiles.brief]
agent = "cc"
prompt = "Merge the summary and risks below into one short brief."

[workflows.assess]
steps = [
  { name = "read", profile = "summarize" },
  { name = "risks", profile = "risks", after = [] },
  { name = "brief", profile = "brief", after = ["read", "risks"] },
]
