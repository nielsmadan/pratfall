[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pratfall"
version = "0.1.0"
description = "One-shot invocations of installed coding agents with named profiles."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Niels Madan" }]
dependencies = []
keywords = ["agents", "cli", "coding-agents", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/nielsmadan/pratfall"
Repository = "https://github.com/nielsmadan/pratfall"
Issues = "https://github.com/nielsmadan/pratfall/issues"

[project.scripts]
prat = "pratfall.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=5", "ruff>=0.16.1", "pylint>=4.0.7", "mypy>=2.3.0"]
docs = ["zensical>=0.0.59"]

[tool.coverage.run]
source = ["pratfall"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
addopts = "--basetemp=.cache/pytest"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "BLE", "S", "SLF", "RUF"]
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.pylint]
max-returns = 8
max-branches = 15
max-statements = 60
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001", "PLR2004"]
"scripts/test_*" = ["S101", "SLF001", "PLR2004"]
"scripts/qa_installed.py" = ["S101", "PLR2004"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["cyclic-import"]

[tool.pylint.reports]
score = false

[tool.mypy]
python_version = "3.13"
files = ["src/pratfall"]
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/pratfall"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pratfall",
    "tests",
    "scripts",
    "examples",
    "packaging",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
