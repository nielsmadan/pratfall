pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    ruff-lint:
      glob: "*.py"
      run: uv run ruff check {staged_files}

pre-push:
  commands:
    check:
      run: just check-static
      priority: 1
    coverage:
      # The only suite run; --cov enforces fail_under (see [tool.coverage.report]).
      run: uv run pytest tests/ scripts/ -q --cov
      priority: 2

